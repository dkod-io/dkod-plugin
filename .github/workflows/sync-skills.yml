name: Sync skill to dkod-io/skills

on:
  push:
    branches: [main]
    paths:
      - "skills/dkod/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: dkod-io/skills
          token: ${{ secrets.SKILLS_SYNC_TOKEN }}
          path: skills-repo

      - name: Copy skill files
        run: |
          cp skills/dkod/SKILL.md skills-repo/SKILL.md
          cp skills/dkod/references/mcp-workflow.md skills-repo/references/mcp-workflow.md

      - name: Push if changed
        working-directory: skills-repo
        run: |
          git config user.name "dkod-bot"
          git config user.email "bot@dkod.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "sync: skill content from dkod-plugin"
            git push
          fi
