name: Sync engine version

on:
  # Triggered by dkod-engine release via repository_dispatch
  repository_dispatch:
    types: [engine-release]
  # Manual trigger
  workflow_dispatch:
  # Check daily in case the dispatch was missed
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: sync-engine-version
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest engine version
        id: engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/dkod-io/dkod-engine/releases/latest" \
            | jq -r '.tag_name // empty')
          if [ -z "$RAW" ]; then
            echo "::error::Failed to fetch latest engine release tag"
            exit 1
          fi
          # Strip leading 'v' prefix (engine tags: v0.2.65 → 0.2.65)
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest engine version: $VERSION"

      - name: Get current plugin version
        id: current
        run: |
          CURRENT=$(jq -r '.version' .claude-plugin/plugin.json)
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "::error::Could not read version from plugin.json"
            exit 1
          fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current plugin version: $CURRENT"

      - name: Update version if changed
        if: steps.engine.outputs.version != steps.current.outputs.version
        env:
          NEW_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          # Use jq to update only the "version" field — no broad sed replacement
          jq --arg v "$NEW_VERSION" '.version = $v' .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json
          jq --arg v "$NEW_VERSION" '.plugins = [.plugins[] | .version = $v]' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
          echo "Updated → $NEW_VERSION"

      - name: Commit and push
        if: steps.engine.outputs.version != steps.current.outputs.version
        env:
          NEW_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          git config user.name "Haim Ari"
          git config user.email "haimari1@gmail.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push
